<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pokedex – Sonorithmia</title>
  <link rel="stylesheet" href="css/pokedex.css" />
  <link rel="stylesheet" href="css/size-additions.css" />
  <link rel="icon" href="ima/icoico.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Pokedex</h1>
    <button class="btn ghost" onclick="location.href='movedex.html'">Ir a Movedex</button>
    <button class="btn ghost" onclick="location.href='entrena.html'">Lideres y Elite</button>
    <div class="filters">
      <input id="q" type="search" placeholder="Buscar por nombre o #..." />
      <select id="typeSel"><option value="">Tipo: Todos</option></select>
      <select id="catSel">
        <option value="">Categoría: Todas</option>
        <option>legendario Mayor</option>
        <option>legendario Menor</option>
        <option>mitico</option>
        <option>pseudo legendario</option>
        <option>starter</option>
        <option>fosil</option>
        <option>estandar</option>
      </select>
      <button id="typeChartBtn" class="btn ghost">Tabla de tipos</button>
      <button id="teamBtn" class="btn">Team Builder</button>
    </div>
  </header>

  <main class="grid" id="app"></main>

  <div id="detail" class="overlay hidden">
    <div class="card3d">
      <section class="face front">
        <button id="closeDetail" class="close">✕</button>
        <div class="dex-head">
          <span id="dNum" class="dex-num"></span>
          <span id="dName" class="dex-name"></span>
        </div>
        <div class="media">
          <img id="dImg" alt="">
          <button id="luxBtn" class="lux-btn" aria-pressed="false" title="Alternar Variante"><img src="ima/lux.png" alt=""></button>
          <button id="shinyBtn" class="shiny-btn" aria-pressed="false" title="Alternar Shiny"><img src="ima/shiny.png" alt=""></button>
        </div>
        <div id="dTypes" class="chips"></div>
        <div class="chips">
          <span id="dHeight" class="chip soft"></span>
          <span id="dWeight" class="chip soft"></span>
          <span id="dHabitat" class="chip soft"></span>
        </div>
        <p id="dDesc" class="desc"></p>
        <div id="dAbilities" class="abilities"></div>
        <div class="stats">
          <canvas id="radar"></canvas>
          <div id="bars" class="bars"></div>
        </div>
        <button id="movesBtn" class="btn big">Movimientos</button>
      </section>

      <section class="face back">
        <button id="closeBack" class="close">✕</button>
        <div class="flip-header">
          <strong id="mvTitle"></strong>
          <button id="backToInfo" class="btn ghost">Volver</button>
        </div>
        <div class="sizebox">
          <div class="scaleWrap">
            <img id="trainerSil" class="sil trainer" alt="">
            <img id="pokeSil" class="sil poke" alt="">
          </div>
          <span id="sizeInfo" class="chip soft"></span>
        </div>
        <div id="moveList" class="moves"></div>
      </section>
    </div>
  </div>

  <div id="typeChart" class="modal hidden">
    <div class="modal-card">
      <button id="closeChart" class="modal-close">✕</button>
      <div class="modal-hero">
        <h2>Tabla de Tipos</h2>
      </div>
      <div class="container" id="chartGrid"></div>
    </div>
  </div>

  <div id="teamBuilder" class="modal hidden">
    <div class="modal-card">
      <button id="closeTeam" class="modal-close">✕</button>
      <div class="modal-hero">
        <h2>Team Builder</h2>
      </div>
      <div class="container team-panel">
        <div id="teamSlots" class="team-slots"></div>
        <div id="teamStats" class="team-stats"></div>
        <div id="teamCoverage" class="team-coverage"></div>
      </div>
    </div>
  </div>
<div id="evo-box"></div>

 <script src="js/pokemon-data.js"></script>
<script src="js/evolution-rules.js"></script>
<script src="js/movimientos.js"></script>
<script src="js/pokemove.js"></script>
<script src="js/pokedex.js"></script>
<script src="js/size.js"></script>

</body>
</html>
